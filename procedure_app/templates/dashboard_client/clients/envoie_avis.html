{% extends 'base_dashboard.html' %}
{% load static %}

{% block body %}
<style>
    :root {
        --justice-blue: #1a365d;
        --justice-yellow: #c5a059;
        --justice-white: #ffffff;
    }

    .card-header {
        background-color: var(--justice-blue) !important;
        color: var(--justice-white) !important;
        border-bottom: 3px solid var(--justice-yellow);
        font-weight: 600;
    }

    .btn-justice-send {
        background-color: var(--justice-blue);
        color: white;
        border: none;
        padding: 10px 25px;
        transition: all 0.3s;
    }

    .btn-justice-send:hover {
        background-color: #122846;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    label {
        color: var(--justice-blue);
        font-weight: 500;
        margin-bottom: 10px;
    }

    .form-control:focus {
        border-color: var(--justice-blue);
        box-shadow: 0 0 0 0.2rem rgba(26, 54, 93, 0.25);
    }
</style>

<div class="container-fluid">
  <div class="row">
    <div class="col-sm-1"></div>
    <div class="col-sm-2"></div>

    <div class="col-sm-7" style="padding-top: 50px">
      <div class="card shadow-sm">
        <div class="card-header">
          <i class="fas fa-paper-plane text-warning mr-2"></i>
          Envoyez-nous vos commentaires sur notre service
        </div>
        
        <div class="card-body">
          <div class="row">
            <div class="col-sm-12">
              <form action="{% url 'client_send_feedback' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                  <label for="comment">Tapez ci-dessous vos commentaires</label>
                  <textarea class="form-control" rows="5" id="comment" name="feedback" required placeholder="Votre message ici..."></textarea>
                </div>
                <br>
                <button type="submit" class="btn btn-justice-send">
                   <i class="fas fa-share-square mr-1"></i> Envoyer
                </button>
              </form>

              <div class="mt-4">
                <div class="d-flex justify-content-center">
                  <div style="width: 100%;">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                      {{ message }}
                      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                      </button>
                    </div>
                    {% endfor %}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-2"></div>
  </div>
</div>

<script type="text/javascript" src="{% static 'js/jquery-2.1.3.min.js' %}"></script>
<script type="text/javascript" src="{% static 'js/bootstrap.min.js' %}"></script>
{% endblock %}
