{% extends 'publisher/base.html' %}
{% load static %}


{% block body %}
<div class="col-md-8 container-fluid mt-5 bg-light col-sm-5 col-xs-5">
    <div id="content" class="p-6 p-md-5 pt-5">
        <div class="col-md-12 col-sm-12 col-xs-10">
            <div class="card mb-3">
                <div class="card-header">
                    <i class="fas fa-table text-primary"></i>
                    Remplir les informations des dossiers
                </div>
                <div class="card-body">
                    <form action="{% url 'uabook' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-group">
                            <div class="col"><input type="text" class="form-control" name="title"
                                    placeholder="Nom complet" required="required"></div>
                        </div>
                        <div class="form-group">
                            <div class="col"><input type="text" class="form-control" name="author" placeholder="Contact (téléphone olu email)"
                                    required="required"></div>
                        </div>

                        <div class="form-group">
                            <div class="col"><input type="text" class="form-control" name="publisher"
                                    placeholder="Type daffaire (divorce, litige, viol , titre foncier, etc)" required="required"></div>
                        </div>

                        <div class="form-group">
                            <div class="col"><input type="text" class="form-control" name="year"
                                    placeholder="Nom de l'adversaire (si applicable)" required="required"></div>
                        </div>

                        <div class="form-group">
                            <div class="col">
                                <!-- <input type="text" class="form-control" name="desc"
                                    placeholder="Description de laffaire(Explication détaillée)" required="required"> -->
                                    <textarea name="desc" class="form-control"  placeholder="Description de laffaire(Explication détaillée)" required="required"></textarea>
                                
                                </div>
                        </div>


                        <div class="form-group">
                            <div class="col"><label>Joindre des documents légaux ou officiels :
                                Veuillez télécharger les documents légaux relatifs à votre affaire,
                                 tels que des contrats, actes de naissance,
                                 plaintes, ou toute autre documentation juridique pertinente pour votre problème.</label>
                                 <label for="">preuve sous forme d'image</label>
                                <input  type="file" id="myFile" name="cover" placeholder="Report Attachment"
                                    enctype="multipart/form-data" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col"><label>Ajouter un document légal</label>
                                <input type="file" id="myFile" name="pdf1" placeholder="Report Attachment"
                                    enctype="multipart/form-data"required >
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col"><label>Ajouter un document légal</label>
                                <input type="file" id="myFile" name="pdf2" placeholder="Report Attachment"
                                    enctype="multipart/form-data" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary btn-lg btn-block" href="">Soumettre le dossier</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</div>
</div>

{% endblock %}
