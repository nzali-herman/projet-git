{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}

<div class="col-md-12 col-sm-5 col-xs-5" style="height:700px; background-image:url('/static/lien/img/just.jpg'); background-size: 400px; background-repeat: no-repeat; background-position: center; background-attachment: fixed;">
    <div class="row">
        <div class="col-sm-2"></div>
    </div>
    
    <div id="content-wrapper">
        <div class="container-fluid"> <br><br><br><br>
            <div class="container-fluid col-lg-12 col-sm-12 col-md-12"> 
                <div class="row">
                    <div class="col-sm-1"></div>
                    <div class="col-sm-1"></div> 
                    
                    <!-- Carte Dossiers --> 
                    <div class="col-xl-2 col-sm-6 mb-3"> 
                        <div class="card text-white bg-success o-hidden h-100">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-fw fa-book"></i>
                                </div>
                                <div class="mr-5"><strong>Dossiers</strong> : {{ book }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#">
                                <span class="float-left">Total dossiers</span><br>
                                <span class="float-right"></span>
                            </a>
                        </div>
                    </div>

                    <!-- Carte Utilisateurs -->
                    <div class="col-xl-2 col-sm-6 mb-3">
                        <div class="card text-white bg-warning o-hidden h-100">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-user-circle fa-fw"></i>
                                </div>
                                <div class="mr-5"><strong>Utilisateurs</strong> : {{ user }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#">
                                <span class="float-left">Total Utilisateurs</span><br>
                                <span class="float-right"></span>
                            </a>
                        </div>
                    </div>
                   
                    <!-- Carte Discussions -->
                    <div class="col-xl-3 col-sm-6 mb-3"> 
                        <div class="card text-white bg-primary o-hidden h-100">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-user-circle fa-fw"></i>
                                </div>
                                <div class="mr-5"><strong>Discussion de groupe</strong> : {{ chat }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#">
                                <span class="float-left">Total messages</span><br>
                                <span class="float-right"></span>
                            </a>
                        </div>
                    </div>
                    
                    <!-- Carte Commentaires -->
                    <div class="col-xl-3 col-sm-6 mb-3">
                        <div class="card text-white bg-warning o-hidden h-100">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-user-circle fa-fw"></i>
                                </div>
                                <div class="mr-5"><strong>Commentaires des utilisateurs</strong> : {{ feedback }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#">
                                <span class="float-left">Total commentaires</span><br>
                                <span class="float-right"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graphique (identique à votre version originale) -->
    <div style="width:40%; margin: auto; margin-top: 350px;" class="fixed-top diagram" style="float: right;">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    // Même script de diagramme que votre version originale
    document.addEventListener('DOMContentLoaded', function() {
        var ctx = document.getElementById('myChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Dossiers', 'Utilisateurs', 'Messages', 'Commentaires'],
                datasets: [{
                    label: 'Statistiques',
                    data: [{{ book }}, {{ user }}, {{ chat }}, {{ feedback }}],
                    backgroundColor: [
                        'rgba(0, 123, 255, 0.5)',
                        'rgba(255, 193, 7, 0.5)',
                        'rgba(40, 167, 69, 0.5)',
                        'rgba(220, 53, 69, 0.5)'
                    ],
                    borderColor: [
                        'rgba(0, 123, 255, 1)',
                        'rgba(255, 193, 7, 1)',
                        'rgba(40, 167, 69, 1)',
                        'rgba(220, 53, 69, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>

{% endblock %}
