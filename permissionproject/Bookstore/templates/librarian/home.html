{% extends 'librarian/base.html' %}
{% load static %}

{% block content %}

<div class="col-md-12 col-sm-5 col-xs-5"
    style="height:700px; background-image:url('/static/lien/img/just.jpg'); background-size: 400px; background-repeat: no-repeat; background-position: center; background-attachment: fixed;">
    <div class="row">
        <div class="col-sm-2"></div>
    </div>

    <div id="content-wrapper">
        <div class="container-fluid animate__animated animate__fadeIn">
            <!-- Cartes de statistiques --> <br><br><br>
            <div class="container-fluid col-lg-12 col-sm-12 col-md-12">
                <div class="row justify-content-center">
                    <div class="col-sm-2"></div>
                    <!-- Carte Dossiers -->
                    <div class="col-xl-2 col-sm-6 mb-3 animate__animated animate__fadeInUp"
                        style="animation-delay: 0.1s">
                        <div class="card cardstatistique text-white h-100"
                            style="background: linear-gradient(135deg, #007a5e, #005a46); border-left: 5px solid #fcd116;">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-fw fa-book fa-2x"></i>
                                </div>
                                <div class="mr-5 mt-3"><strong>Dossiers</strong>: {{ book }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#"
                                style="background-color: rgba(0,0,0,0.1);">
                                <span class="float-left">Total dossiers</span>
                                <span class="float-right">
                                    <i class="fas fa-angle-right"></i>
                                </span>
                            </a>
                        </div>
                    </div>

                    <!-- Carte Utilisateurs -->
                    <div class="col-xl-2 col-sm-6 mb-3 animate__animated animate__fadeInUp"
                        style="animation-delay: 0.2s">
                        <div class="card cardstatistique text-white h-100"
                            style="background: linear-gradient(135deg, #ce1126, #a00d1f); border-left: 5px solid #fcd116;">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-user-circle fa-fw fa-2x"></i>
                                </div>
                                <div class="mr-5 mt-3"><strong>Utilisateurs</strong>: {{ user }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#"
                                style="background-color: rgba(0,0,0,0.1);">
                                <span class="float-left">Total Utilisateurs</span>
                                <span class="float-right">
                                    <i class="fas fa-angle-right"></i>
                                </span>
                            </a>
                        </div>
                    </div>

                    <!-- Carte Discussions -->
                    <div class="col-xl-3 col-sm-6 mb-3 animate__animated animate__fadeInUp"
                        style="animation-delay: 0.3s">
                        <div class="card cardstatistique text-white h-100"
                            style="background: linear-gradient(135deg, #fcd116, #e5bc10); border-left: 5px solid #ce1126;">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-comments fa-fw fa-2x"></i>
                                </div>
                                <div class="mr-5 mt-3"><strong>Discussion de groupe</strong>: {{ chat }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#"
                                style="background-color: rgba(0,0,0,0.1); color: #333 !important;">
                                <span class="float-left">Total messages</span>
                                <span class="float-right">
                                    <i class="fas fa-angle-right"></i>
                                </span>
                            </a>
                        </div>
                    </div>

                    <!-- Carte Commentaires -->
                    <div class="col-xl-3 col-sm-6 mb-3 animate__animated animate__fadeInUp"
                        style="animation-delay: 0.4s">
                        <div class="card cardstatistique text-white h-100"
                            style="background: linear-gradient(135deg, #007a5e, #005a46); border-left: 5px solid #ce1126;">
                            <div class="card-body">
                                <div class="card-body-icon">
                                    <i class="fas fa-comment-dots fa-fw fa-2x"></i>
                                </div>
                                <div class="mr-5 mt-3"><strong>Commentaires</strong>: {{ feedback }}</div>
                            </div>
                            <a class="card-footer text-white clearfix small z-1" href="#"
                                style="background-color: rgba(0,0,0,0.1);">
                                <span class="float-left">Total commentaires</span>
                                <span class="float-right">
                                    <i class="fas fa-angle-right"></i>
                                </span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graphique -->
    <div style="width:40%; margin: auto; margin-top: 350px;"
        class="fixed-top diagram animate__animated animate__fadeInRight">
        <canvas id="myChart"></canvas>
    </div>
</div>

<style>
    .cardstatistique {
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        overflow: hidden;
    }

    .cardstatistique:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .card-body-icon {
        position: absolute;
        right: 15px;
        top: 15px;
        opacity: 0.3;
        font-size: 90px;
        transition: all 0.3s ease;
    }

    .cardstatistique:hover .card-body-icon {
        transform: scale(1.1);
        opacity: 0.5;
    }

    .card-footer {
        transition: all 0.3s ease;
    }

    .cardstatistique:hover .card-footer {
        background-color: rgba(0, 0, 0, 0.2) !important;
    }
</style>

<script>
    // Animation du graphique
    document.addEventListener('DOMContentLoaded', function () {
        var ctx = document.getElementById('myChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Dossiers', 'Utilisateurs', 'Messages', 'Commentaires'],
                datasets: [{
                    label: 'Statistiques',
                    data: [{{ book }}, {{ user }}, {{ chat }}, {{ feedback }}],
        backgroundColor: [
        '#007a5e',
        '#ce1126',
        '#fcd116',
        '#007a5e'
    ],
        borderColor: [
        '#005a46',
        '#a00d1f',
        '#e5bc10',
        '#005a46'
    ],
        borderWidth: 1
                }]
            },
        options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        },
        animation: {
            duration: 2000,
            easing: 'easeOutBounce'
        }
    }
        });
    });
</script>
{% endblock %}
